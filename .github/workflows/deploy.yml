name: Build And Test CRM Pipeline

on: 
  push:
    branches:
      - main

  pull_request:
    branches: 
      - main

permissions:
      id-token: write
      contents: read          

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 
          
      - name: Build Docker Image
        run: docker build -t crm-backend .

      - name: Run Docker container 
        run: docker run -d --name backend-crm -p 8000:8000 -e DATABASE_URL="${{ secrets.DATABASE_URL }}" crm-backend
     
      - name: Test Backend 
        run: | 
          for i in {1..12}; do 
            if curl --fail http://localhost:8000/health; then 
              echo "Backend is healthy" 
              exit 0 
            fi 
          
            echo "Backend not ready yet... attempt $i/12" 
            sleep 5

          done 
          
          echo "Backend failed health check" 
          exit 1 
      
      - name: Show container Logs if test fails 
        if: failure() 
        run: docker logs backend-crm

      - name: SSH into EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Login to Amazon ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            # Set variables
            ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            ECR_REPOSITORY="crm-repo"
            IMAGE_TAG="${{ github.sha }}"

            # Tag the existing Docker image
            docker tag crm-backend:latest \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            # Push image to ECR
            docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend 
        run: npm ci

#      - name: Lint Frontend
#        working-directory: frontend
#        run: npm run lint
      
      - name: Build Frontend Docker Image 
        run: | 
          docker build -t crm-frontend ./frontend 
      
      - name: Run Frontend Container 
        run: docker run -d --name crm-frontend-test -p 3000:3000 crm-frontend

      - name: Test Frontend
        run: |
          for i in {1..12}; do 
            if curl --fail http://localhost:3000; then 
              echo "Frontend is healthy" 
              exit 0

              fi 
              
              echo "Frontend not ready yet... attempt $i/12" 
              sleep 5 
            done 
            
            echo "Frontend failed health check" 
            exit 1

      - name: Frontend Container Logs
        if: failure()
        run: docker logs crm-frontend-test   

